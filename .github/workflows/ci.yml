name: TelloZune CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

# Só lê o repositório; nenhum job precisa escrever
permissions:
  contents: read

# Um novo push no mesmo PR cancela a execução anterior
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Lint (ruff)
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
    - name: Checkout do código
      uses: actions/checkout@v4

    - name: Configurar o Python
      uses: actions/setup-python@v5
      with:
        python-version: "3.14"

    - name: Rodar ruff (configuração em ruff.toml)
      run: |
        python -m pip install ruff==0.14.0
        ruff check --output-format github .

  test:
    name: Testes (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        # 3.10 é a versão mínima (setup.py) e a do Ubuntu 22.04 / ROS 2 Humble
        python-version: [ "3.10", "3.11", "3.12", "3.13", "3.14" ]

    steps:
    - name: Checkout do código
      uses: actions/checkout@v4

    - name: Configurar o Python
      uses: actions/setup-python@v5
      with:
        python-version: ${{ matrix.python-version }}
        cache: pip
        cache-dependency-path: requirements.txt

    - name: Instalar dependências
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt coverage

    - name: Rodar testes unitários (unittest) com cobertura
      run: |
        coverage run --source=tello_zune -m unittest discover -s test -v
        coverage report -m

  package:
    name: Pacote (build e instalação)
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
    - name: Checkout do código
      uses: actions/checkout@v4

    - name: Configurar o Python
      uses: actions/setup-python@v5
      with:
        python-version: "3.10"

    - name: Conferir que a versão do setup.py é a mesma do README
      run: |
        python - <<'EOF'
        import pathlib, re, sys
        setup = re.search(r'version="([^"]+)"', pathlib.Path("setup.py").read_text()).group(1)
        readme = re.search(r'# Tello Zune \(v([^)]+)\)', pathlib.Path("README.md").read_text()).group(1)
        print(f"setup.py: {setup}  README.md: {readme}")
        sys.exit(0 if setup == readme else f"Versões diferentes: setup.py {setup} x README.md {readme}")
        EOF

    - name: Gerar sdist e wheel
      run: |
        python -m pip install --upgrade pip build
        python -m build

    - name: Instalar o wheel num ambiente limpo e importar
      run: |
        python -m venv /tmp/venv
        /tmp/venv/bin/pip install dist/*.whl
        cd /tmp
        /tmp/venv/bin/python -c "from tello_zune import TelloZune; import importlib.metadata as m; print('tello_zune', m.version('tello_zune'), 'importado:', TelloZune.__name__)"
